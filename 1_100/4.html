<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: rgb(198, 180, 79);
            display: grid;
            place-items: center;
        }

        #canv {
            position: absolute;
            border: .1vmin solid;
            top: 20%;
        }

        .controls {
            width: 100vw;
            height: 50px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            margin-top: 40px;
        }

        #start {
            margin-right: 40px;
        }

        #pause {

        }

    </style>
</head>
<body>
    <div class="controls">
        <button id="start">Start</button>
        <button id="pause">Pause</button>
    </div>
    <canvas id="canv"></canvas>
    <script>
        let gameInterval = null;
        let direction = 'RIGHT';
        const canvas = document.getElementById("canv");
        const context = canvas.getContext("2d");

        const CELL_SIZE = 20;
        const GRID_SIZE = 20;

        canvas.width = CELL_SIZE * GRID_SIZE;
        canvas.height = CELL_SIZE * GRID_SIZE;

        let snake = [
            { x: 5, y: 10 },
            { x: 4, y: 10 },
            { x: 3, y: 10 }
        ];

        let food = {
            x: 2,
            y: 2
        }

        // draw grid
        function drawGrid() {
            context.fillStyle = 'black';
            for (let i=0;i<GRID_SIZE;i++) {
                const x = i * CELL_SIZE;
                for (let j=0;j<GRID_SIZE;j++) {
                    const y = j * CELL_SIZE;
                    context.fillRect(x, y, CELL_SIZE - 1, CELL_SIZE - 1);
                }
            }
        }

        // draw snake
        function drawSnake() {
            for (i=0; i<snake.length; i++) {
                const x = snake[i].x * CELL_SIZE;
                const y = snake[i].y * CELL_SIZE;
                if (i === 0) {
                    context.fillStyle = "yellow";
                    context.fillRect(x, y, CELL_SIZE - 1, CELL_SIZE - 1);
                } else {
                    context.fillStyle = "green";
                    context.fillRect(x, y, CELL_SIZE - 1, CELL_SIZE - 1);
                }
                
            }
        }

        // draw food
        function drawFood() {
            const x = food.x * CELL_SIZE;
            const y = food.y * CELL_SIZE;

            context.beginPath();
            context.fillStyle = "red";
            context.arc(10, 10, 10 - 1, 0, 2 * Math.PI);
            context.fill();
        }

        // move snake
        function moveSnake() {
            let head = {...snake[0]};
            switch (direction) {
                case 'UP':
                    head.y -= 1;
                    break;
                
                case 'RIGHT':
                    head.x += 1;
                    break;
                
                case 'DOWN':
                    head.y += 1;
                    break;
                
                case 'LEFT':
                    head.x -= 1;
                    break;
            
                default:
                    break;
            }
            snake.unshift(head);
            snake.pop();
        }

        // listen to direction
        document.addEventListener("keydown", (event) => {
            switch (event.key) {
                case "ArrowUp":
                    direction = 'UP'
                    break;

                case "ArrowRight":
                    direction = 'RIGHT'
                    break;

                case "ArrowDown":
                    direction = 'DOWN'
                    break;

                case "ArrowLeft":
                    direction = 'LEFT';
                    break;
            
                default:
                    break;
            }
        });

        document.getElementById('start').addEventListener("click", () => {
             gameLoop();
        })

        document.getElementById('pause').addEventListener("click", () => {
             gameInterval = null
        })

        

        // gameloop
        function gameLoop() {
            if (gameInterval !== null) return;

            gameInterval = setInterval(() => {
                // clear board
                context.clearRect(0, 0, canvas.width, canvas.height);
                drawGrid();
                drawSnake();
                drawFood();
                moveSnake();
            }, 100);
        }
       
    </script>
</body>
</html>
