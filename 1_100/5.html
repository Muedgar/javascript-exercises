<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: rgb(64, 250, 225);
            display: grid;
            place-items: center;
        }

        #canv {
            position: absolute;
            top: 10%;
        }
    </style>
</head>
<body>
    <canvas id="canv"></canvas>
    <script>
        let gameInterval = null;
        let direction = 'UP';
        const canvas = document.getElementById("canv");
        const context = canvas.getContext("2d");

        const CELL_SIZE = 25;
        const GRID_SIZE = 20;

        canvas.width = CELL_SIZE * GRID_SIZE;
        canvas.height = CELL_SIZE * GRID_SIZE;

        let food = {
            x: 2,
            y: 2
        }

        let snake = [
            { x: 5, y: 10 },
            { x: 4, y: 10 },
            { x: 3, y: 10 }
        ]

        function drawBoard() {
            for (let i = 0; i<GRID_SIZE; i++) {
                for (let j=0; j<GRID_SIZE; j++) {
                const x = j * CELL_SIZE;
                const y = i * CELL_SIZE;
                    context.fillRect(x, y, CELL_SIZE - 1, CELL_SIZE -1);
                    context.fillRect(x, y, CELL_SIZE - 1, CELL_SIZE -1);
                }
            }
        }

        function drawFood() {
            const x = food.x * CELL_SIZE;
            const y = food.y * CELL_SIZE;
            context.fillStyle = "red";
            context.fillRect(x, y, CELL_SIZE - 1, CELL_SIZE - 1);
        }

        function drawSnake() {
            for (let i=0; i<snake.length; i++) {
                if (i === 0) {
                    context.fillStyle = "yellow";
                    context.fillRect(snake[i].x * CELL_SIZE, snake[i].y * CELL_SIZE, CELL_SIZE - 1, CELL_SIZE - 1);
                } else {
                    context.fillStyle = "lightgreen";
                    context.fillRect(snake[i].x * CELL_SIZE, snake[i].y * CELL_SIZE, CELL_SIZE - 1, CELL_SIZE - 1);
                }
            }
        }

        function moveSnake() {
            const head = {...snake[0]}
            switch (direction) {
                case 'UP':
                    head.y -= 1;
                    break;

                case 'LEFT':
                    head.x -= 1;
                    break;

                case 'RIGHT':
                    head.x += 1;
                    break;

                case 'DOWN':
                    head.y += 1;
                    break;
            
                default:
                    break;
            }
            snake.unshift(head);
            snake.pop();
        }

        document.addEventListener("click", (event) => {
            switch (event.key) {
                case 'ArrowUp':
                    direction = 'UP'
                    break;

                case 'ArrowLeft':
                    direction = 'LEFT'
                    break;

                case 'ArrowRight':
                    direction = 'RIGHT'
                    break;

                case 'ArrowDown':
                    direction = 'DOWN'
                    break;
            
                default:
                    break;
            }
        });

        function gameLoop() {
            if (gameInterval !== null) return;

            gameInterval = setInterval(() =>{
                context.clearRect(0, 0, canvas.width, canvas.height)
            drawBoard();
            drawFood();
            drawSnake();

            
            moveSnake();
            }, 200)
        }

        gameLoop();

    </script>
</body>
</html>
